[project]
name = "kalshi-bots"
version = "0.1.0"
description = "Kalshi sports prediction-market trading system (demo)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12.0"]
# Real slash-command/button interactivity (kalshi_bots/discord_gateway.py).
# Optional: the orchestrator lazy-imports this and falls back to a REST-only
# or console transport when discord.py isn't installed.
discord = ["discord.py>=2.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kalshi_bots*"]
